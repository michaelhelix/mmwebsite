<script>
(function () {

  var px = 0, py = 0, tx = 0, ty = 0, lastPX = null, spinVel = 0, rotY = 0.6, rotX = 0.4;
  var cur = lock >= 0 ? lock : 0, formT = 0, trans = null;
  var track = { i: 0, t: 0 }, ro = null, bodies = null;

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function ease(t) { t = clamp(t, 0, 1); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  function rgba(a) { return 'rgba(255,255,255,' + clamp(a, 0, 1).toFixed(3) + ')'; }
  function pad(n, l) { n = String(n); while (n.length < l) n = '0' + n; return n; }
  function sgn(v) { return (v < 0 ? '−' : '+') + Math.abs(v).toFixed(2); }

  /* ---------- geometry: every form lives in 4D (3D forms sit at w = 0); edges = all pairs at the shortest distance ---------- */
  function finish(V) {
    var m = 0, i, j, k, n, d, q, best = Infinity, D = [], E = [];
    for (i = 0; i < V.length; i++) { if (V[i].length < 4) V[i].push(0); n = 0; for (k = 0; k < 4; k++) n += V[i][k] * V[i][k]; m = Math.max(m, Math.sqrt(n)); }

  }); });
  for (var ii = 0; ii < 4; ii++) S.forEach(function (a) { var v = [0, 0, 0, 0]; v[ii] = a; cV.push(v); });
  /* 600-cell = the 24-cell's vertices + 96 even permutations of (±φ/2, ±1/2, ±1/2φ, 0) */
  cV.forEach(function (v) { hV.push(v.slice()); });
  var EVEN = [[0,1,2,3],[0,2,3,1],[0,3,1,2],[1,0,3,2],[1,2,0,3],[1,3,2,0],[2,0,1,3],[2,1,3,0],[2,3,0,1],[3,0,2,1],[3,1,0,2],[3,2,1,0]];
  EVEN.forEach(function (pm) { S.forEach(function (a) { S.forEach(function (b) { S.forEach(function (c) {
    var base = [a * PHI / 2, b / 2, c / (2 * PHI), 0], v = [0, 0, 0, 0];

    { q: 0, A: 1, sub: 8, g: finish(dV) },

    { q: 1, A: 0.92, sub: 4, g: finish(cV) },
    { q: 1, A: 0.6, sub: 1, g: finish(hV) }
  ];

  /* ---------- projection ---------- */
  var cY = 1, sY = 0, cX = 1, sX = 0, ca = 1, sa = 0, cb = 1, sb = 0, Q = 0, ZM = 1;

    var j, t0, t1, arr;
