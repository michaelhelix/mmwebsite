    document.getElementById('mm-term-clr').addEventListener('click', function () { tmsg.value = ''; tout.textContent = ''; tmsg.focus(); });

    /* ----- gallery: every entry has its own frame somewhere in the hall; choosing one flies there, up and over the partition walls ----- */
    function slot(n) { return { s: n % 2 ? -1 : 1, i: (16 + n * 7) % 18 }; }

    }
    function arrive(n) {

      hop = null; curN = n; lockN = n; viewN = n; imgA = 0; skip.style.display = 'none';
      set('archStat', 'Docked'); set('archPos', 'Frame ' + (sl.s > 0 ? 'E' : 'W') + '-' + p2(sl.i + 1));
      document.getElementById('mm-cap-t').textContent = S.one + ' ' + p2(n + 1) + ' — ' + (it ? it.name : 'empty');
      document.getElementById('mm-cap-m').textContent = it ? [it.type, it.date].filter(Boolean).join(' · ') + (it.note ? ' — ' + it.note : '') : S.none;
      if (it && it.href) { o.href = it.href; o.style.display = 'inline-flex'; } else o.style.display = 'none';
      cap.style.display = 'block';
    }
    function drawImg(g) {
      var it = S.items[viewN], sl = slot(viewN), z = 6 + sl.i * 4.6, x = sl.s * 7.9, x0, y0, x1, y1, w, h, r, iw, ih;
      if (!it || !it.im || !it.im.complete || !it.im.naturalWidth) return;

    }
    document.getElementById('mm-cap-p').addEventListener('click', function () { var n = Math.max(6, S.items.length); flyTo((curN - 1 + n) % n); });
    document.getElementById('mm-cap-n').addEventListener('click', function () { var n = Math.max(6, S.items.length); flyTo((curN + 1) % n); });
    document.getElementById('mm-cap-l').addEventListener('click', function () { cap.style.display = 'none'; build(); box.style.display = 'block'; var b = list.children[curN]; if (b) { b.setAttribute('aria-pressed', 'true'); b.focus(); } });

    var SECT = {
      '01': { title: '01 / Design', place: 'Gallery hall', fly: true, moving: 'Crossing gallery', found: 'Frame located', one: 'Frame', empty: 'Empty frame', none: 'Nothing hangs in this frame yet.', count: 'frames hung', hint: 'Select a frame to fly to it.', label: 'Design frames', items: DESIGN, T: 7.6, TURN: 1.5, dist: GE - GS, cam: galCam, scene: galScene },
      '04': { title: '04 / Contact', place: 'Channel 04', moving: 'Entering signal noise', found: 'Carrier found', term: true, T: 3.6, TURN: 1.1, cam: function () {}, scene: burstScene, pos: function () { return PN + ' glyphs · V ' + bV.toFixed(2); } },
      '03': { title: '03 / Archive', place: 'Rack A-05-06', moving: 'Traversing hall A', found: 'Rack located', one: 'Slot', empty: 'Empty slot', none: 'Nothing is stored in this slot yet.', count: 'slots in use', hint: 'Select a slot.', label: 'Archive files', items: ARCHIVE, T: 6.4, TURN: 1.4, dist: ZE - ZS, cam: hallCam, scene: hallScene }
    };
    function frame(now) {
      if (!on) return;
      raf = requestAnimationFrame(frame);
      var dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016; last = now; t += dt;
      if (docked && !hop && (fr++ % 3)) return;
      var u = Math.min(1, t / S.T), q = ez((t - S.T) / S.TURN);
      if (hop) { hop.t += dt; hopCam(Math.min(1, hop.t / hop.dur)); } else if (!free) S.cam(u * u * u * (u * (u * 6 - 15) + 10), q, t);
      sy = Math.sin(cam.yaw); cyw = Math.cos(cam.yaw); sp = Math.sin(cam.pitch); cp = Math.cos(cam.pitch);
      lock = free ? 1 : Math.min(1, Math.max(0, (t - (S.T - 1.6)) / 1.2));
      if (!docked && t >= S.T + S.TURN) dock();
      var dimT = docked && !hop && (!S.fly || box.style.display === 'block') ? 1 : 0;
      dimK += (dimT - dimK) * Math.min(1, dt * 12);
      c.setTransform(DPR, 0, 0, DPR, 0, 0); c.clearRect(0, 0, W, H);
      S.scene(t, Math.min(1, t / 0.5) * (1 - 0.62 * dimK));

        set('archPos', S.pos ? S.pos() : 'Z ' + (cam.z < 0 ? '−' : '+') + Math.abs(cam.z).toFixed(1) + ' M · ' + ((30 * u * u * (1 - u) * (1 - u) * S.dist) / S.T).toFixed(1) + ' M/S');
      }
    }
    function pick(b, item, n) {
      [].forEach.call(list.children, function (o) { o.setAttribute('aria-pressed', o === b ? 'true' : 'false'); });

      var h = document.createElement('div'), m = document.createElement('div');
      h.style.cssText = 'color:#fff;font-size:13px;letter-spacing:.2em;text-transform:uppercase';
      h.textContent = item ? item.name : S.one + ' ' + p2(n) + ' — empty';
      m.textContent = item ? [item.type, item.date, item.size].filter(Boolean).join(' · ') + (item.note ? ' — ' + item.note : '') : S.none;
      detail.appendChild(h); detail.appendChild(m);
      if (item && item.img) {
        var im = document.createElement('img'); im.src = item.img; im.alt = item.name;
        im.style.cssText = 'display:block;max-width:100%;max-height:42vh;margin-top:12px;border:1px solid rgba(255,255,255,.26)'; detail.appendChild(im);
      }
      if (item && item.href) {
        var a = document.createElement('a'); a.className = 'mm-btn'; a.href = item.href; a.target = '_blank'; a.rel = 'noopener'; a.textContent = '[ Open ]';
        a.style.cssText = 'margin-top:12px;text-decoration:none'; detail.appendChild(a);
      }
    }
    function build() {
      list.textContent = ''; detail.textContent = S.hint; detail.style.minHeight = S.fly ? '0' : '74px';
      var n = Math.max(6, S.items.length), i;
      for (i = 0; i < n; i++) (function (i) {
        var it = S.items[i] || null, b = document.createElement('button'), a = document.createElement('span'), m = document.createElement('span'), r = document.createElement('span');
        b.type = 'button'; b.className = 'mm-file' + (it ? '' : ' mm-empty'); b.setAttribute('aria-pressed', 'false');
        a.textContent = p2(i + 1); a.style.cssText = 'flex:none;color:rgba(255,255,255,.5);letter-spacing:.1em';
        m.textContent = it ? it.name : S.empty; m.style.cssText = 'flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
        r.textContent = it ? (it.type || '') : '—'; r.style.cssText = 'flex:none;font-size:10px;color:rgba(255,255,255,.5)';
        b.appendChild(a); b.appendChild(m); b.appendChild(r);
        b.addEventListener('click', function () { if (S.fly) flyTo(i); else pick(b, it, i + 1); });
        list.appendChild(b);
      })(i);
      set('archCount', S.items.length + ' / ' + n + ' ' + S.count);
    }
    function dock() {
      docked = true; t = Math.max(t, S.T + S.TURN); skip.style.display = 'none';
      set('archStat', 'Docked'); set('archPos', S.place);
      if (S.term) { termOpen(); return; }
      if (S.fly) { viewN = 0; imgA = 0; set('archPos', 'Frame E-17'); }
      build(); box.style.display = 'block'; box.classList.add('mm-panel');
      var b = list.querySelector('button'); if (b) b.focus();
    }
    function size() {
      var r = cv.getBoundingClientRect(); if (r.width < 2) return;
      W = r.width; H = r.height; DPR = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); cx = W / 2; cy = H / 2; f = 0.55 * Math.max(W, H); dockD = (f * 3) / Math.min(W - 24, 640);
    }

      if (!c || on || !sc) return;
      S = sc; from = b; on = true; docked = false; hop = null; free = false; curN = 0; viewN = -1; lockN = 0; cap.style.display = 'none'; FSL = {};
      if (S.fly) { for (var n0 = Math.max(6, S.items.length) - 1; n0 >= 0; n0--) { var sl0 = slot(n0); FSL[sl0.s + ':' + sl0.i] = n0; } S.items.forEach(function (it) { if (it.img && !it.im) { it.im = new Image(); it.im.src = it.img; } }); }
      dimK = 0; t = still ? S.T + S.TURN : 0; last = 0; fr = 0;
      set('runTitle', S.title); set('runPlace', S.place); set('archStat', ''); set('archPos', ''); box.setAttribute('aria-label', S.label);
      box.style.display = 'none'; term.style.display = 'none'; bLast = 0; CL.length = 0; skip.style.display = still ? 'none' : 'block';
      el.style.display = 'block'; el.style.animation = 'mm-fade .45s ease both';
      engine.setPaused(true); size(); raf = requestAnimationFrame(frame);
      document.getElementById('mm-arch-x').focus();
    }
    function close() {
      if (!on) return;
      on = false; cancelAnimationFrame(raf); el.style.display = 'none'; engine.setPaused(false);
      if (from) from.focus();
    }
    cv.addEventListener('pointerdown', function () { if (on && hop) hop.t = hop.dur; else if (on && !docked && t > 0.3) t = S.T + S.TURN; });
    document.getElementById('mm-arch-x').addEventListener('click', close);
    window.addEventListener('resize', function () { if (on) size(); });
    return { open: open, close: close, has: function (idx) { return !!c && !!SECT[idx]; } };
  })();
  function open(b) {
    if (arch.has(b.getAttribute('data-idx'))) { arch.open(b); return; }
    lastBtn = b;
    var l = b.querySelector('.mm-label'), title = l ? l.textContent : 'Sector';
    set('panelIdx', b.getAttribute('data-idx') || ''); set('panelTitle', title); dialog.setAttribute('aria-label', title);
    panel.style.display = 'flex'; engine.setDim(true);
    var c = panel.querySelector('.mm-btn'); if (c) c.focus();
  }

    panel.style.display = 'none'; engine.setDim(false);

  }
  [].forEach.call(document.querySelectorAll('.mm-node'), function (b) {

    b.addEventListener('focus', on); b.addEventListener('blur', off);
    b.addEventListener('click', function () { open(b); });
  });
  panel.addEventListener('click', function (e) { if (e.target === panel || (e.target.closest && e.target.closest('.mm-btn'))) close(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { arch.close(); close(); } });
})();
